name: Release

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      dry_run:
        description: Run workflow without actually publishing
        type: boolean
        default: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        build:
          - linux
          - windows-msvc

        include:
          - build: linux
            os: ubuntu-latest
            install-deps: sudo apt-get install -y gcc-multilib
            toolchain: stable
            targets: x86_64-unknown-linux-gnu i686-unknown-linux-gnu
            configs: linux64 linux32

          - build: windows-msvc
            os: windows-latest
            toolchain: stable
            targets: x86_64-pc-windows-msvc i686-pc-windows-msvc
            configs: win64 win32

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ${{ matrix.install-deps }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
          python-version: ">=3.15"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.targets }}

      - name: Build
        run: uv run build.py ${{ matrix.configs }}

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          files: "dist/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
