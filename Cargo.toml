[package]
name = "stool"
version = "0.2.0"
edition = "2024"
authors = ["Forb.Jok <forbjok@proton.me>"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
crc32fast = "1.5.5"
ctrlc = { version = "3.5.3", features = ["termination"] }
dialoguer = "0.12.0"
dirs = "7.0.0"
filetime = "0.2.30"
globset = "0.4.21"
notify = "8.2.2"
num_enum = "0.7.6"
ratatui = "0.30.2"
serde = "1.0.229"
serde_derive = "1.0.229"
subst = "0.3.8"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-prompts = "0.6.8"
tui-logger = { version = "0.18.3", default-features = false, features = ["tracing-support"] }
walkdir = "2.5.0"
