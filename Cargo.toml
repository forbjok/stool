[package]
name = "stool"
version = "0.2.0"
edition = "2024"
authors = ["Forb.Jok <forbjok@proton.me>"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
crc32fast = "1.5.0"
ctrlc = "3.5.0"
dialoguer = "0.12.0"
dirs = "6.0.0"
filetime = "0.2.26"
globset = "0.4.16"
notify = "8.2.0"
num_enum = "0.7.4"
ratatui = "0.29.0"
serde = "1.0.227"
serde_derive = "1.0.227"
sysinfo = { version = "0.37.1", default-features = false, features = ["system"] }
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros"] }
toml = "0.9.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tui-logger = { version = "0.17.3", default-features = false, features = ["tracing-support"] }
tui-textarea = "0.7.0"
walkdir = "2.5.0"
