[package]
name = "stool"
version = "0.2.0"
edition = "2024"
authors = ["Forb.Jok <forbjok@proton.me>"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
crc32fast = "1.5.0"
ctrlc = { version = "3.5.1", features = ["termination"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
filetime = "0.2.26"
globset = "0.4.18"
notify = "8.2.0"
num_enum = "0.7.5"
ratatui = "0.30.0"
serde = "1.0.228"
serde_derive = "1.0.228"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
thiserror = "2.0.17"
time = { version = "0.3.45", features = ["formatting", "local-offset", "macros"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tui-prompts = "0.6.1"
tui-logger = { version = "0.18.0", default-features = false, features = ["tracing-support"] }
walkdir = "2.5.0"
