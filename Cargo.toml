[package]
name = "stool"
version = "0.2.0"
edition = "2024"
authors = ["Forb.Jok <forbjok@proton.me>"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
crc32fast = "1.5.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
filetime = "0.2.29"
globset = "0.4.19"
notify = "8.2.0"
num_enum = "0.7.6"
ratatui = "0.30.2"
serde = "1.0.228"
serde_derive = "1.0.228"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "local-offset", "macros"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-prompts = "0.6.7"
tui-logger = { version = "0.18.3", default-features = false, features = ["tracing-support"] }
walkdir = "2.5.0"
